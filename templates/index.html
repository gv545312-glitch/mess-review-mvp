<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess Review System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero">

        <nav>
            <div class="logo">🍴 MESS REVIEW SYSTEM</div>

            <div class="nav-links">
                <a href="#">Explore</a>
                <a href="#">Write Review</a>
                <a href="#">Dashboard</a>
            </div>
        </nav>

        <div class="hero-content">

            <div class="left">

                <h1>
                    Rate Your <br>
                    <span>University Mess</span>
                </h1>

                <p>
                    Honest student reviews on campus dining across India
                </p>

                <div class="stats">

                    <div class="stat-box">
                        <h2>12</h2>
                        <span>Universities</span>
                    </div>

                    <div class="stat-box">
                        <h2>847</h2>
                        <span>Reviews</span>
                    </div>

                    <div class="stat-box">
                        <h2>3.8</h2>
                        <span>Avg Rating</span>
                    </div>

                </div>

            </div>

            <div class="right">
                <img src="https://images.unsplash.com/photo-1552566626-52f8b828add9?q=80&w=1200&auto=format&fit=crop" alt="">
            </div>

        </div>

    </section>

    <section class="search-section">

        <input type="text" placeholder="Search university by name or city...">

        <button>Search</button>

    </section>

    <section class="cards-section">

        <h2>Universities</h2>

        <div class="cards">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1562774053-701939374585?w=800" alt="">
                <div class="card-content">
                    <h3>Amity University</h3>
                    <button>View Reviews</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=800" alt="">
                <div class="card-content">
                    <h3>Galgotias University</h3>
                    <button>View Reviews</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=800" alt="">
                <div class="card-content">
                    <h3>Sharda University</h3>
                    <button>View Reviews</button>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?w=800" alt="">
                <div class="card-content">
                    <h3>Bennett University</h3>
                    <button>View Reviews</button>
                </div>
            </div>

        </div>

    </section>

    <footer>
        Made with ❤️ by Garima
    </footer>

</body>
</html>
