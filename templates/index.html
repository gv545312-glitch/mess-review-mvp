<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Mess Reviews</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            min-height:100vh;
            color:white;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:auto;
            padding:40px 0;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            font-size:45px;
        }

        .card-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            color:black;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.3);
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.03);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .card-content{
            padding:20px;
        }

        .card-content h2{
            margin-bottom:15px;
        }

        form{
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        input,
        textarea,
        select{
            padding:12px;
            border-radius:10px;
            border:none;
            font-size:15px;
        }

        textarea{
            resize:none;
            height:100px;
        }

        button{
            background:#ff4b2b;
            color:white;
            border:none;
            padding:12px;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ff2e00;
        }

        .reviews{
            margin-top:15px;
        }

        .review-box{
            background:#f3f3f3;
            padding:10px;
            border-radius:10px;
            margin-top:10px;
        }

        .stars{
            color:gold;
            font-size:18px;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>🍽 University Mess Reviews</h1>

        <div class="card-grid">

            {% for uni in universities %}

            <div class="card">

                <img src="{{ uni.image }}" alt="{{ uni.name }}">

                <div class="card-content">

                    <h2>{{ uni.name }}</h2>

                    <form method="POST">

                        <input
                            type="hidden"
                            name="university_name"
                            value="{{ uni.name }}"
                        >

                        <select name="rating" required>
                            <option value="">Select Rating</option>
                            <option value="1">1 ⭐</option>
                            <option value="2">2 ⭐</option>
                            <option value="3">3 ⭐</option>
                            <option value="4">4 ⭐</option>
                            <option value="5">5 ⭐</option>
                        </select>

                        <textarea
                            name="feedback"
                            placeholder="Write your feedback..."
                            required
                        ></textarea>

                        <button type="submit">
                            Submit Review
                        </button>

                    </form>

                    <div class="reviews">

                        {% for review in reviews %}

                            {% if review.university_name == uni.name %}

                            <div class="review-box">

                                <div class="stars">
                                    {{ "⭐" * review.rating }}
                                </div>

                                <p>{{ review.feedback }}</p>

                                <small>
                                    {{ review.created_at }}
                                </small>

                            </div>

                            {% endif %}

                        {% endfor %}

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</body>
</html>
