<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Mess Reviews</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0f172a;
    color:white;
    padding:20px;
}

.heading{
    text-align:center;
    margin-bottom:40px;
}

.heading h1{
    font-size:3rem;
    margin-bottom:10px;
}

.heading p{
    color:#94a3b8;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

/* CARD */

.card{
    background:#111827;
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.08);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

/* CONTENT */

.content{
    padding:20px;
}

.uni-name{
    font-size:1.4rem;
    margin-bottom:20px;
}

/* TABLE STYLE */

.info-box{
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    overflow:hidden;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,0.08);
}

.row:last-child{
    border-bottom:none;
}

.label{
    color:#cbd5e1;
}

.value{
    color:#facc15;
    font-weight:bold;
}

/* BUTTON */

.btn{
    width:100%;
    margin-top:18px;
    padding:14px;
    border:none;
    border-radius:14px;
    background:#7c3aed;
    color:white;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
}

/* MOBILE */

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .heading h1{
        font-size:2rem;
    }

}

</style>
</head>

<body>

<div class="heading">

    <h1>🍽️ Mess Review Platform</h1>

    <p>
        Compare mess quality across top universities
    </p>

</div>

<div class="grid">

{% for uni in universities %}

<div class="card">

    <img src="{{ uni.image }}" alt="{{ uni.name }}">

    <div class="content">

        <h2 class="uni-name">
            {{ uni.name }}
        </h2>

        <div class="info-box">

            <div class="row">
                <span class="label">Food Quality</span>
                <span class="value">⭐ 4.2</span>
            </div>

            <div class="row">
                <span class="label">Hygiene</span>
                <span class="value">⭐ 4.0</span>
            </div>

            <div class="row">
                <span class="label">Taste</span>
                <span class="value">⭐ 4.3</span>
            </div>

            <div class="row">
                <span class="label">Overall</span>
                <span class="value">⭐ 4.1</span>
            </div>

        </div>

        <button class="btn">
            View Reviews
        </button>

    </div>

</div>

{% endfor %}

</div>

</body>
</html>
