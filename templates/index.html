<!DOCTYPE html>
<html>
<head>
    <title>Mess Reviews</title>

    <style>

        body{
            font-family: Arial;
            background:#f5f5f5;
            padding:20px;
        }

        h1{
            text-align:center;
        }

        #searchInput{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border-radius:10px;
            border:1px solid gray;
        }

        .card-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .stars{
            color:gold;
            font-size:20px;
        }

        button{
            padding:10px 15px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

    </style>
</head>

<body>

    <h1>Noida University Mess Reviews</h1>

    <input type="text" id="searchInput" placeholder="Search university...">

    <div class="card-container" id="cardContainer">
        
        {% for university in universities %}

        <div class="card">
        
            <img src="{{ university.image }}" width="100%" style="border-radius:10px; height:180px; object-fit:cover;">
        
            <h2>{{ university.name }}</h2>
        
            <p class="stars">⭐⭐⭐⭐</p>
        
            <p>0 Reviews</p>
        
            <button>Give Review</button>
        
        </div>
        
        {% endfor %}
        
    </div>

<script>

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function() {

    let filter = searchInput.value.toLowerCase();

    let cards = document.querySelectorAll(".card");

    cards.forEach(function(card){

        let text = card.innerText.toLowerCase();

        if(text.includes(filter)){
            card.style.display = "block";
        } else {
            card.style.display = "none";
        }

    });

});

</script>

</body>
</html>
