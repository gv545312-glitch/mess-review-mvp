<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Universities
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            MessReview
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/universities">
                Universities
            </a>

        </div>

    </nav>



    <!-- PAGE HEADING -->

    <section class="page-heading">

        <h1>
            Explore Universities
        </h1>

        <p>
            Browse university mess reviews across India
        </p>

    </section>



    <!-- SEARCH -->

    <section class="search-section">

        <div class="hero-search">

            <input
                type="text"
                id="searchInput"
                placeholder="Search university..."
            >

            <button>
                Search
            </button>

        </div>

    </section>



    <!-- UNIVERSITIES GRID -->

    <section class="universities-section">

        <div class="grid" id="universityGrid">

            {% for uni in universities %}

            <div class="card">

                <img
                    src="{{ uni.image }}"
                    alt="{{ uni.name }}"
                >

                <div class="card-content">

                    <h3>
                        {{ uni.name }}
                    </h3>

                    <p>
                        📍 Greater Noida, UP
                    </p>

                    <div class="rating">

                        ⭐⭐⭐⭐☆ 4.2 Rating

                    </div>

                    <a
                        href="/university/{{ uni.name }}"
                        class="view-btn"
                    >
                        View Details →
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </section>



    <!-- FOOTER -->

    <footer>

        <div class="footer-logo">
            MessReview
        </div>

        <p>
            © 2026 MessReview · Made with 💜 by Garima Verma
        </p>

    </footer>



    <!-- SEARCH JS -->

    <script>

        const searchInput =
        document.getElementById("searchInput");

        searchInput.addEventListener("keyup", function(){

            let filter =
            searchInput.value.toLowerCase();

            let cards =
            document.querySelectorAll(".card");

            cards.forEach(card => {

                let text =
                card.innerText.toLowerCase();

                if(text.includes(filter)){

                    card.style.display = "block";

                }

                else{

                    card.style.display = "none";

                }

            });

        });

    </script>

</body>
</html>
